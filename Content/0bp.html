<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bad Parenting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0b0b0e;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0e;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      height: 100vh;
      width: auto;
      max-width: 100vw;
      max-height: 100vh;
      box-sizing: border-box;
      position: relative !important;
      left: auto !important;
      top: auto !important;
    }

    /* Minimalist Unkplay Loader Screen */
    #unkplay-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0b0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #ffffff;
      user-select: none;
    }

    .brand-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #f3f4f6;
    }

    .progress-text {
      font-size: 32px;
      font-weight: 400;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }

    #error-overlay {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 100000;
      padding: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      display: none;
      word-break: break-word;
      border-radius: 6px;
    }

    @media (max-width: 1000px) {
      #unity-canvas {
        width: 100%;
        height: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Minimalist Unkplay Loading Screen -->
  <div id="unkplay-loader">
    <div class="brand-title">Unkplay</div>
    <div class="progress-text" id="loader-percent">0%</div>
  </div>

  <div id="error-overlay" role="alert" aria-live="polite"></div>

  <div id="game-container">
    <canvas class="emscripten" id="unity-canvas" oncontextmenu="event.preventDefault()" style="position: fixed; width: auto; height: auto; left: 0%; top: 0;"></canvas>
  </div>

  <!-- Game Bootstrap & Loader Integration -->
  <script>
    (function () {
      const BASE_URL = "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/bad-parenting/";
      const ERROR_OVERLAY = document.getElementById('error-overlay');
      const canvas = document.getElementById('unity-canvas');
      const unkplayLoader = document.getElementById('unkplay-loader');
      const loaderPercent = document.getElementById('loader-percent');

      function updateProgress(value) {
        const pct = Math.min(100, Math.max(0, Math.round(value)));
        if (loaderPercent) {
          loaderPercent.textContent = `${pct}%`;
        }
      }

      function showError(msg) {
        console.error(msg);
        ERROR_OVERLAY.textContent = msg;
        ERROR_OVERLAY.style.display = 'block';
      }

      function hideError() {
        ERROR_OVERLAY.style.display = 'none';
        ERROR_OVERLAY.textContent = '';
      }

      function loadScript(url, attrs = {}) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          if (attrs.defer) s.defer = true;
          if (attrs.type) s.type = attrs.type;
          if (attrs.crossorigin) s.crossOrigin = attrs.crossorigin;
          s.onload = () => resolve(s);
          s.onerror = () => reject(new Error('Failed to load script ' + url));
          document.head.appendChild(s);
        });
      }

      async function loadSplitData(baseUrlNoPartSuffix, parts, startPct, weightPct) {
        const chunks = [];
        for (let i = 1; i <= parts; i++) {
          const partUrl = `${baseUrlNoPartSuffix}.part${i}`;
          const res = await fetch(partUrl, { mode: 'cors' });
          if (!res.ok) throw new Error(`Failed to load ${partUrl} (status ${res.status})`);
          const chunk = await res.arrayBuffer();
          chunks.push(chunk);

          const currentPartProgress = (i / parts) * weightPct;
          updateProgress(startPct + currentPartProgress);
        }
        const mergedBlob = new Blob(chunks);
        return URL.createObjectURL(mergedBlob);
      }

      function normalizeCanvasInlineStyle() {
        try {
          canvas.style.position = 'relative';
          canvas.style.left = '';
          canvas.style.top = '';
          canvas.style.right = '';
          canvas.style.bottom = '';
        } catch (e) {}
      }

      let normalizeInterval = null;
      function startNormalizingCanvas() {
        normalizeCanvasInlineStyle();
        if (normalizeInterval) clearInterval(normalizeInterval);
        normalizeInterval = setInterval(normalizeCanvasInlineStyle, 200);
      }
      function stopNormalizingCanvas() {
        if (normalizeInterval) {
          clearInterval(normalizeInterval);
          normalizeInterval = null;
        }
        normalizeCanvasInlineStyle();
      }

      function fitCanvasCss() {
        canvas.style.maxWidth = '100vw';
        canvas.style.maxHeight = '100vh';
      }
      window.addEventListener('resize', fitCanvasCss);
      fitCanvasCss();

      (async function bootstrap() {
        try {
          hideError();

          const loaderScriptUrl = BASE_URL + 'Build/Build.loader.js';
          try {
            await loadScript(loaderScriptUrl);
          } catch (err) {
            showError(
              `Could not load Unity loader from "${loaderScriptUrl}".\n` +
              `Check that the file exists and that the server returns proper CORS headers.`
            );
            throw err;
          }

          if (typeof createUnityInstance !== 'function') {
            showError('Loader loaded but createUnityInstance is not available.');
            throw new Error('createUnityInstance undefined');
          }

          const config = {
            dataUrl: BASE_URL + 'Build/Build.data',
            frameworkUrl: BASE_URL + 'Build/Build.framework.js',
            codeUrl: BASE_URL + 'Build/Build.wasm',
            streamingAssetsUrl: BASE_URL + 'StreamingAssets',
            companyName: "twoootwo",
            productName: "Bad Parenting 1",
            productVersion: "1.0",
            showBanner: (msg, type) => { console.log('Unity banner', type, msg); }
          };

          startNormalizingCanvas();

          // Download multi-part binaries (0% -> 30%)
          try {
            const [wasmObjUrl, dataObjUrl] = await Promise.all([
              loadSplitData(BASE_URL + 'Build/Build.wasm', 2, 0, 15),
              loadSplitData(BASE_URL + 'Build/Build.data', 3, 15, 15)
            ]);
            config.codeUrl = wasmObjUrl;
            config.dataUrl = dataObjUrl;
          } catch (splitErr) {
            console.warn('Split-part loading failed — using direct Build files:', splitErr);
            updateProgress(30);
          }

          // Instantiate Unity engine (30% -> 100%)
          createUnityInstance(canvas, config, (progress) => {
            const percent = 30 + (70 * progress);
            updateProgress(percent);
          }).then((unityInstance) => {
            stopNormalizingCanvas();
            normalizeCanvasInlineStyle();
            fitCanvasCss();
            updateProgress(100);

            setTimeout(() => {
              if (unkplayLoader) unkplayLoader.style.display = "none";
            }, 150);
          }).catch((errMessage) => {
            showError('Failed to instantiate Unity: ' + (errMessage && errMessage.message ? errMessage.message : errMessage));
            throw new Error('createUnityInstance failed: ' + errMessage);
          });

        } catch (errMain) {
          console.error('Bootstrap error:', errMain);
        }
      })();
    })();
  </script>
</body>
</html>
