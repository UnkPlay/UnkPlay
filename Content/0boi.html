<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binding of Wrath</title>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      background: #0b0b0e;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111111;
      z-index: 0;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    ruffle-player {
      aspect-ratio: 960 / 600;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    /* Minimalist Unkplay Loader Screen */
    #unkplay-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0b0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #ffffff;
      user-select: none;
    }

    .brand-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #f3f4f6;
    }

    .progress-text {
      font-size: 32px;
      font-weight: 400;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Minimalist Loading Screen -->
  <div id="unkplay-loader">
    <div class="brand-title">Unkplay</div>
    <div class="progress-text" id="loader-percent">0%</div>
  </div>

  <div id="bg"></div>
  <div id="game-container"></div>

  <script>
    // Global Ruffle configuration
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      splashScreen: false,
      unmuteOverlay: "hidden",
      letterbox: "on"
    };

    const loaderPercent = document.getElementById("loader-percent");
    const unkplayLoader = document.getElementById("unkplay-loader");

    function updateProgress(value) {
      const pct = Math.min(100, Math.max(0, Math.round(value)));
      if (loaderPercent) {
        loaderPercent.textContent = `${pct}%`;
      }
    }

    // Fetches the SWF file with real network progress tracking
    async function fetchSwfWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

      const contentLength = response.headers.get('content-length');
      if (!contentLength) {
        // Fallback if server doesn't send Content-Length header
        const arrayBuffer = await response.arrayBuffer();
        updateProgress(100);
        return arrayBuffer;
      }

      const totalBytes = parseInt(contentLength, 10);
      let loadedBytes = 0;
      const reader = response.body.getReader();
      const chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        loadedBytes += value.length;
        updateProgress((loadedBytes / totalBytes) * 100);
      }

      const allChunks = new Uint8Array(loadedBytes);
      let position = 0;
      for (const chunk of chunks) {
        allChunks.set(chunk, position);
        position += chunk.length;
      }

      return allChunks.buffer;
    }

    window.addEventListener("DOMContentLoaded", async () => { 
      const swfUrl = "https://cdn.jsdelivr.net/gh/RobiFet/CMinterview@a4017231eca9f2173ad7ec0e63b01e4786b4ad6b/web/src/BiWrath.swf";

      try {
        // 1. Download SWF binary and track actual progress percentage
        const swfBuffer = await fetchSwfWithProgress(swfUrl);

        // 2. Instantiate Ruffle player
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("game-container").appendChild(player);

        // 3. Load SWF data array buffer directly into player
        await player.load({
          data: swfBuffer,
          autoplay: "on",
          splashScreen: false,
          unmuteOverlay: "hidden",
          letterbox: "on"
        });

        // 4. Hide loading screen when ready
        if (unkplayLoader) {
          unkplayLoader.style.display = "none";
        }
      } catch (err) {
        console.error("Failed to load SWF game:", err);
      }
    });
  </script>
</body>
</html>
